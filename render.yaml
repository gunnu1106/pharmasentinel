services:
  - type: web
    name: pharmasentinel
    runtime: python
    buildCommand: pip install fastapi uvicorn sqlalchemy praw python-dotenv httpx
    startCommand: >
      cd backend &&
      python3 -c "from database import engine; from models import Base; Base.metadata.create_all(bind=engine); from database import SessionLocal; from main import _seed_database; db = SessionLocal(); _seed_database(db); db.close()" &&
      python3 -c "import sys; sys.path.insert(0,'.'); from fastapi.staticfiles import StaticFiles; from main import app; app.mount('/frontend', StaticFiles(directory='../frontend', html=True), name='frontend'); import uvicorn; uvicorn.run(app, host='0.0.0.0', port=10000, log_level='warning')"
    envVars:
      - key: PORT
        value: 10000
    rootDir: .
